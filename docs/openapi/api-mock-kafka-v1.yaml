openapi: 3.0.3
info:
  title:  API Mock Nodo PagoPA
  version: 1.0.0
tags:
    - name: Connection
      description: Endpoint per la gestione della connessione con il mock di Kafka
    - name: Payment
      description: Endpoint per la simulazione della pubblicazione di un pagamento verso il Nodo dei pagamenti
    - name: Onboarding
      description: Endpoint per la simulazione della pubblicazione di un onboarding verso il Nodo kafka dei contratti
paths:
  /external-channels/v1/kafka/connection:
    get:
      summary: Verifica connessione con il mock di kafka
      description: Endpoint per la verifica della connessione con il mock di kafka
      tags:
        - Connection
      operationId: checkKafkaConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnection'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Regola la connessione con il mock kafka del nodo dei pagamenti
      description: Endpoint per la regolazione della connessione con il mock kafka del nodo dei pagamenti
      tags:
        - Connection
      operationId: setKafkaConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaConnection'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnection'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /external-channels/v1/kafka/payment:
    post:
      operationId: producePayment
      tags:
        - Payment
      summary: Simula la pubblicazione di un pagamento verso il Nodo dei pagamenti
      description: >- 
        L'endpoint consente di simulare la pubblicazione di un pagamento verso il Nodo dei pagamenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticePaymentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaProducerResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /external-channels/v1/kafka/onboarding:
    post:
      operationId: produceOnboarding
      tags:
        - Onboarding
      summary: Simula la pubblicazione di un onboarding verso il Nodo dei contratti
      description: >-
        L'endpoint consente di simulare la pubblicazione di un onboarding verso il Nodo dei contratti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaProducerResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:

    KafkaConnection:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Flag per abilitare/disabilitare la connessione con il mock kafka del nodo dei pagamenti

    NoticePaymentRequest:
      type: object
      properties:
        noticeNumber:
          description: Payment notice number  numero avviso
          example: '302000100000019421'
          type: string
          maxLength: 18
          minLength: 18
          pattern: '^\d+$'
        creditorTaxId:
          description: Payment PA fiscal code
          example: '77777777777'
          type: string
          maxLength: 11
          minLength: 11
          pattern: '^\d+$'
        paymentDateTime:
          type: string
          pattern: ^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})(\.[0-9]+)?(Z|([+\-][0-9]{2}):([0-9]{2}))$
          description: data e ora in formato ISO 8601
        amount:
          description: Importo del pagamento in eurocent
          type: string
          example: "1000"

    OnboardingRequest:
      type: object
      description: >- 
        Request per la simulazione della pubblicazione di un onboarding verso il Nodo dei contratti
        Gli attributi non sono obbligatori, se non forniti verranno generati in automatico dal mock di kafka
      properties:
        billing:
          $ref: '#/components/schemas/OnboardingBilling'
        contentType:
          type: string
          example: application/json
        fileName:
          type: string
          example: onboarding.json
        filePath:
          type: string
          example: /tmp/onboarding.json
        id:
          type: string
          example: onb-123
        institution:
          $ref: '#/components/schemas/OnboardingInstitution'
        internalInstitutionId:
          type: string
          example: int-inst-123
        onboardingTokenId:
          type: string
          example: token-123
        product:
          type: string
          example: prod-pn
        state:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T10:35:00Z'
        pricingPlan:
          type: string
          example: free
        zipCode:
          type: string
          example: '00100'

    OnboardingBilling:
      type: object
      properties:
        recipientCode:
          type: string
          example: RECIPIENT-001
        vatNumber:
          type: string
          example: '12345678901'
        publicServices:
          type: boolean
          example: true

    OnboardingInstitution:
      type: object
      required:
        - taxCode
      properties:
        address:
          type: string
          example: Via Roma 1
        description:
          type: string
          example: Comune di Milano
        digitalAddress:
          type: string
          example: comune@pec.it
        institutionType:
          type: string
          example: PA
        origin:
          type: string
          example: IPA
        originId:
          type: string
          example: origin-001
        taxCode:
          type: string
          description: Codice fiscale dell'ente o partita IVA in formato standard.
          example: '01234567890'
          pattern: '^(([A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z])|(\d{11}))$'
        rootParent:
          $ref: '#/components/schemas/OnboardingRootParent'

    OnboardingRootParent:
      type: object
      properties:
        id:
          type: string
          example: root-parent-1
        originId:
          type: string
          example: root-origin-1
        description:
          type: string
          example: Root parent description


    KafkaProducerResponse:
      type: object
      required:
        - requestId
      description: >-
        La risposta contiene i metadati kafka ottenuti dalla produzione di un evento verso il nodo.
      properties:
        offset:
          type: string
          minLength: 1
          maxLength: 250
          description: Offset kafka della richiesta di pagamento inoltrata al Nodo dei pagamenti.
        partition:
          type: string
          minLength: 1
          maxLength: 250
          description: Partition kafka della richiesta di pagamento inoltrata al Nodo dei pagamenti.

    Problem:
      required:
        - type
        - status
        - title
        - errors
      properties:
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          type: integer
          format: int32
          example: 503
          maximum: 600
          minimum: 100
          exclusiveMaximum: true
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        detail:
          description: A human readable explanation of the problem.
          example: Request took too long to complete.
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
        traceId:
          description: Internal support identifier associated to error
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      required:
        - code
      properties:
        code:
          description: Internal code of the error, in human-readable format
          example: PN_PARAMETER_TOO_LONG | PN_PARAMETER_TOO_SHORT | PN_DUPLICATE_ENTRY | etc...
          type: string
        element:
          description: Parameter or request body field name for validation error
          example: 'body.order.item[2].quantity'
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem.
          example: Parameter not valid
          maxLength: 1024
          type: string
