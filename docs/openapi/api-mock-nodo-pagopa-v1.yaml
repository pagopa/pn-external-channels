openapi: 3.0.3
info:
  title:  API Mock Nodo PagoPA
  version: 1.0.0
tags:
    - name: Payment
      description: Endpoint per la simulazione della pubblicazione di un pagamento verso il Nodo dei pagamenti
paths:
  /external-channels/nodo-pagopa/kafka/connection:
    get:
      summary: Verifica connessione con il mock del nodo dei pagamenti
      description: Endpoint per la verifica della connessione con il mock del nodo dei pagamenti
      tags:
        - Payment
      operationId: checkNodoPagopaConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnection'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Regola la connessione con il mock kafka del nodo dei pagamenti
      description: Endpoint per la regolazione della connessione con il mock kafka del nodo dei pagamenti
      tags:
        - Payment
      operationId: setNodoPagopaConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KafkaConnection'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaConnection'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /external-channels/nodo-pagopa/v1/payment:
    post:
      operationId: producePayment
      tags:
        - Payment
      summary: Simula la pubblicazione di un pagamento verso il Nodo dei pagamenti
      description: >- 
        L'endpoint consente di simulare la pubblicazione di un pagamento verso il Nodo dei pagamenti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticePaymentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePaymentResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:

    KafkaConnection:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Flag per abilitare/disabilitare la connessione con il mock kafka del nodo dei pagamenti

    NoticePaymentRequest:
      type: object
      properties:
        noticeNumber:
          description: Payment notice number  numero avviso
          example: '302000100000019421'
          type: string
          maxLength: 18
          minLength: 18
          pattern: '^\d+$'
        creditorTaxId:
          description: Payment PA fiscal code
          example: '77777777777'
          type: string
          maxLength: 11
          minLength: 11
          pattern: '^\d+$'
        paymentDateTime:
          type: string
          pattern: ^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})(\.[0-9]+)?(Z|([+\-][0-9]{2}):([0-9]{2}))$
          description: data e ora in formato ISO 8601
        amount:
          description: Importo del pagamento in eurocent
          type: string
          example: "1000"

    NoticePaymentResponse:
      type: object
      required:
        - requestId
      description: >-
        La risposta contiene l'identificativo della richiesta di pagamento inoltrata al Nodo dei pagamenti.
      properties:
        offset:
          type: string
          minLength: 1
          maxLength: 250
          description: Offset kafka della richiesta di pagamento inoltrata al Nodo dei pagamenti.
        partition:
          type: string
          minLength: 1
          maxLength: 250
          description: Partition kafka della richiesta di pagamento inoltrata al Nodo dei pagamenti.

    Problem:
      required:
        - type
        - status
        - title
        - errors
      properties:
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          type: integer
          format: int32
          example: 503
          maximum: 600
          minimum: 100
          exclusiveMaximum: true
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        detail:
          description: A human readable explanation of the problem.
          example: Request took too long to complete.
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
        traceId:
          description: Internal support identifier associated to error
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      required:
        - code
      properties:
        code:
          description: Internal code of the error, in human-readable format
          example: PN_PARAMETER_TOO_LONG | PN_PARAMETER_TOO_SHORT | PN_DUPLICATE_ENTRY | etc...
          type: string
        element:
          description: Parameter or request body field name for validation error
          example: 'body.order.item[2].quantity'
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem.
          example: Parameter not valid
          maxLength: 1024
          type: string
